name: iTOUCH

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]
  create: # for tags
  workflow_dispatch: 

env:
  CARGO_TERM_COLOR: always

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout iTOUCH
      uses: actions/checkout@v4
      with:
        repository: 'touchHLE/touchHLE'
        ref: 'trunk'
        fetch-depth: 0

    - name: Check formatting
      run: dev-scripts/format.sh --check

    - name: Get Submodules
      run: git submodule update --init

    # 1. Setup Java (Required for Gradle to run)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 2. Setup Android NDK natively without downloading manually
    - name: Setup Android NDK
      uses: android-actions/setup-android@v3
      with:
        ndk-version: '25.2.9519653'

    # 3. Download Boost using a reliable, direct URL
    - name: Try to get cached copy of Boost
      id: cache-boost
      uses: actions/cache@v3
      with:
        path: vendor/boost
        key: boost_1_81_0

    - if: steps.cache-boost.outputs.cache-hit != 'true'
      name: Download and Extract Boost
      run: |
        mkdir -p vendor
        curl -L "https://boost.io" | tar -C vendor -xzf -
        mv vendor/boost_1_81_0 vendor/boost

    # 4. Set up Rust toolchains
    - name: Install AArch64 Android Rust toolchain
      run: rustup target add aarch64-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk@3.5.4

    # 5. Generate local.properties automatically using the verified runner path
    - name: Generate local.properties file
      run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

    # 6. Build the project using the native wrapper instead of downloading isolated Gradle binaries
    - name: Build for Android
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease
        mv app/build/outputs/apk/release/app-release.apk ../iTOUCH.apk
      env:
        ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653

    - uses: actions/upload-artifact@v4
      with:
        name: iTOUCH
        path: iTOUCH.apk

name: iTOUCH

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]
  create: # for tags
  workflow_dispatch: 

env:
  CARGO_TERM_COLOR: always

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout iTOUCH
      uses: actions/checkout@v4
      with:
        repository: 'touchHLE/touchHLE'
        ref: 'trunk'
        fetch-depth: 0

    - name: Check formatting
      run: dev-scripts/format.sh --check

    - name: Get Submodules
      run: git submodule update --init

    # 1. Setup Java 17 for Gradle
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 2. Setup your NDK version natively from pre-installed runner assets
    - name: Setup Android NDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'ndk;25.2.9519653'

    # 3. Pulls down Boost using the official, built-in GitHub CLI
    - name: Try to get cached copy of Boost
      id: cache-boost
      uses: actions/cache@v3
      with:
        path: vendor/boost
        key: boost_1_81_0

    - if: steps.cache-boost.outputs.cache-hit != 'true'
      name: Download and Extract Boost via GitHub CLI
      run: |
        mkdir -p vendor
        gh release download boost-1.81.0 --repo boostorg/boost --archive --output boost.tar.gz
        tar -C vendor -xzf boost.tar.gz
        mv vendor/boost-boost-1.81.0 vendor/boost
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 4. Sets up standard Rust toolchains
    - name: Install AArch64 Android Rust toolchain
      run: rustup target add aarch64-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk@3.5.4

    # 5. Configures properties using global runner paths
    - name: Generate local.properties file
      run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

    # 6. Executes compilation using native project wrappers
    - name: Build for Android
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease
        mv app/build/outputs/apk/release/app-release.apk ../iTOUCH.apk
      env:
        ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653

    - uses: actions/upload-artifact@v4
      with:
        name: iTOUCH
        path: iTOUCH.apk

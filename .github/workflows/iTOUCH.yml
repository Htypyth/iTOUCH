name: Build iTOUCH

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]
  create: # for tags
  workflow_dispatch: 

env:
  CARGO_TERM_COLOR: always

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout iTOUCH
      uses: actions/checkout@v4
      with:
        repository: 'touchHLE/touchHLE'
        ref: 'trunk'
        fetch-depth: 0

    - name: Check formatting
      run: dev-scripts/format.sh --check

    - name: Get Submodules
      run: git submodule update --init

    # 1. Setup Java 17 for Gradle
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 2. Setup your NDK version natively from pre-installed runner assets
    - name: Setup Android NDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'ndk;25.2.9519653'

    # 3. Natively installs Boost directly from the Linux System Repositories
    - name: Install System Boost Development Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y libboost-all-dev

    # 4. Sets up standard Rust toolchains
    - name: Install AArch64 Android Rust toolchain
      run: rustup target add aarch64-linux-android

    # 5. Install cargo-ndk
    - name: Install cargo-ndk
      run: cargo install cargo-ndk@3.5.4

    # 6. Configures properties using global runner paths
    - name: Generate local.properties file
      run: |
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> android/local.properties

    # 7. Generates a fresh compatible builder wrapper and compiles
    - name: Build for Android
      run: |
        cd android
        gradle wrapper --gradle-version 8.11.1
        chmod +x gradlew
        ./gradlew assembleRelease
        find . -name "*.apk" -exec mv {} ${{ github.workspace }}/iTOUCH.apk \;
      env:
        ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        BOOST_ROOT: /usr

    - uses: actions/upload-artifact@v4
      with:
        name: iTOUCH
        path: iTOUCH.apk
